name: Publish to npm

# Manual trigger: publishing is a deliberate act, not a side effect of a push.
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for OIDC trusted publishing + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing (OIDC) needs npm >= 11.5.1; the runner's bundled npm
      # is older and falls back to token auth, which fails with ENEEDAUTH.
      - name: Use an npm that supports trusted publishing
        run: npm install -g npm@latest
      - name: Test
        run: node test/run.js
      # No NODE_AUTH_TOKEN: npm exchanges the Actions OIDC token with the
      # registry itself. An empty token env would make npm demand a login.
      - name: Publish
        run: npm publish --access public
